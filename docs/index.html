<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cat vs Dog CNN Classifier</title>
    <link rel="stylesheet" href="./style.css" />
    <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/dist/ort.min.js"></script>
    <script defer src="./app.js"></script>
  </head>
  <body>
    <main class="app-shell">
      <section class="workspace">
        <div class="topbar">
          <div>
            <h1>Cat vs Dog CNN</h1>
            <p>학습한 기본 CNN 모델로 업로드한 이미지를 고양이/강아지로 분류합니다.</p>
          </div>
          <span id="modelStatus" class="status">모델 준비 중</span>
        </div>

        <div class="panel-grid">
          <section class="upload-panel">
            <div id="dropZone" class="drop-zone" tabindex="0">
              <span class="drop-title">이미지 선택</span>
              <span class="drop-detail">캡처 이미지를 Ctrl + V로 붙여넣거나 드래그하세요.</span>
            </div>

            <figure class="preview-frame">
              <canvas id="previewCanvas" width="256" height="256"></canvas>
              <figcaption id="previewCaption">256 x 256 입력 미리보기</figcaption>
            </figure>

            <input id="imageInput" type="file" accept="image/*" />
            <button id="uploadButton" class="upload-button" type="button">파일 업로드</button>
          </section>

          <section class="result-panel">
            <div class="result-header">
              <span>출력 확률</span>
              <strong id="predictionLabel">대기 중</strong>
            </div>

            <div class="bars">
              <div class="bar-row">
                <span class="class-name">Cat</span>
                <div class="bar-track">
                  <div id="catBar" class="bar-fill cat"></div>
                </div>
                <span id="catValue" class="value">0.0%</span>
              </div>

              <div class="bar-row">
                <span class="class-name">Dog</span>
                <div class="bar-track">
                  <div id="dogBar" class="bar-fill dog"></div>
                </div>
                <span id="dogValue" class="value">0.0%</span>
              </div>
            </div>

            <div class="meta">
              <span>입력 크기</span>
              <strong>3 x 256 x 256</strong>
            </div>
            <div class="meta">
              <span>모델 파일</span>
              <strong>model.onnx</strong>
            </div>
          </section>
        </div>
      </section>
    </main>
  </body>
</html>
